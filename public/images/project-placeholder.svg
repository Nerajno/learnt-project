<svg width="700" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:0.1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="700" height="400" fill="url(#bg-gradient)"/>

  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E5E7EB" stroke-width="1" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="700" height="400" fill="url(#grid)"/>

  <!-- Icon -->
  <g transform="translate(280, 140)">
    <!-- Code brackets icon -->
    <path d="M40 30 L20 50 L40 70" stroke="#6366F1" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M100 30 L120 50 L100 70" stroke="#6366F1" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="70" cy="40" r="3" fill="#6366F1"/>
    <circle cx="70" cy="50" r="3" fill="#6366F1"/>
    <circle cx="70" cy="60" r="3" fill="#6366F1"/>
  </g>

  <!-- Text -->
  <text x="350" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#6B7280">
    Project Screenshot
  </text>
  <text x="350" y="285" font-family="system-ui, -apple-system, sans-serif" font-size="14" text-anchor="middle" fill="#9CA3AF">
    Coming Soon
  </text>

  <!-- Decorative elements -->
  <circle cx="100" cy="80" r="4" fill="#818CF8" opacity="0.4"/>
  <circle cx="600" cy="320" r="6" fill="#A78BFA" opacity="0.3"/>
  <circle cx="150" cy="350" r="3" fill="#6366F1" opacity="0.5"/>
  <circle cx="550" cy="100" r="5" fill="#7C3AED" opacity="0.4"/>
</svg>
